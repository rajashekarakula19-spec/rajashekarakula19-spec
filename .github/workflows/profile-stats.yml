name: Refresh profile graphics
on:
  schedule:
    - cron: '23 10 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-graphics
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render public GitHub statistics
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/update_profile_stats.py
      - name: Commit refreshed graphics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/github-*.svg
          if ! git diff --cached --quiet; then
            git commit -m "docs: refresh GitHub profile graphics"
            git push
          fi

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 70" width="100%" height="auto" role="img" aria-label="Footer divider">
  <defs>
    <linearGradient id="footer-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10070C" stop-opacity="0" />
      <stop offset="30%" stop-color="#451126" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#C77B9B" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#451126" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#10070C" stop-opacity="0" />
      <animate attributeName="x1" values="-50%;0%;50%" dur="8s" repeatCount="indefinite" />
      <animate attributeName="x2" values="50%;100%;150%" dur="8s" repeatCount="indefinite" />
    </linearGradient>

    <radialGradient id="footer-center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E5B5C7" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#701A3D" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#10070C" stop-opacity="0" />
    </radialGradient>

    <style>
      .footer-txt {
        font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Menlo, monospace;
        letter-spacing: 4px;
        text-transform: uppercase;
        font-size: 11px;
        fill: #C77B9B;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="70" fill="#10070C" />

  <!-- Top Shimmer Beam -->
  <line x1="100" y1="20" x2="1100" y2="20" stroke="url(#footer-beam)" stroke-width="1.5" />

  <!-- Central Diamond Accent -->
  <g transform="translate(600, 20)">
    <circle cx="0" cy="0" r="14" fill="url(#footer-center-glow)">
      <animate attributeName="r" values="12;18;12" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite" />
    </circle>
    <polygon points="0,-5 5,0 0,5 -5,0" fill="#F8F0F3" />
  </g>

  <!-- Editorial Text -->
  <text x="600" y="52" text-anchor="middle" class="footer-txt">
    Crafted with Intention  ·  Engineered for Scale &amp; Reliability
  </text>
</svg>
